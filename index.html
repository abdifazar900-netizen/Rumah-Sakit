<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean Klinik PWA</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063822.png">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 (Notifikasi Modern) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // CONFIGURATION: Tempelkan URL Web App GAS Anda di sini
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzpdFipZVk7eVPrtX6G5BXWSWqbLG-6Bialr611J5fysyx1HmEwGG3T_1i6N-DGen1g8Q/exec";
    </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen antialiased text-slate-800">

    <!-- FULLSCREEN LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center text-white">
        <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
        <p id="loadingText" class="text-sm font-semibold tracking-wide">Memproses data...</p>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4 shadow-sm">
                    <i class="fa-solid fa-hospital-user text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Sistem Antrean Klinik</h1>
                <p class="text-sm text-slate-500 mt-1">Silakan masuk sesuai hak akses Anda</p>
            </div>

            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition flex justify-center items-center gap-2">
                    <span>Masuk ke Sistem</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="hidden min-h-screen flex flex-col">
        <!-- NAVBAR -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                        <i class="fa-solid fa-clinic-medical text-lg"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-900 leading-none">Klinik Sehat</h2>
                        <span id="userRoleBadge" class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mt-1 inline-block">Role</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="userInfo" class="text-sm font-semibold text-slate-700 hidden sm:inline">User</span>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition" title="Keluar">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- DASHBOARD CONTAINER -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            
            <!-- PANEL PENDAFTARAN -->
            <div id="panelPendaftaran" class="hidden">
                <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-bold">Formulir Pendaftaran Pasien</h3>
                            <p class="text-xs text-slate-400">Input data pasien dan keluhan awal</p>
                        </div>
                        <i class="fa-solid fa-id-card text-2xl text-blue-400"></i>
                    </div>
                    <form id="formPendaftaran" onsubmit="submitPendaftaran(event)" class="p-6 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">NIK Pasien</label>
                                <input type="text" id="p_nik" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                                <input type="text" id="p_nama" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
                                <input type="date" id="p_tgl_lahir" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">No. WhatsApp/HP</label>
                                <input type="text" id="p_no_hp" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Singkat</label>
                            <input type="text" id="p_alamat" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Keluhan Utama</label>
                            <textarea id="p_keluhan" rows="3" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition">
                            Simpan & Terbit Antrean
                        </button>
                    </form>
                </div>
            </div>

            <!-- PANEL TENAGA MEDIS -->
            <div id="panelMedis" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xl font-bold text-slate-900">Antrean Pemeriksaan Medis</h3>
                    <button onclick="fetchAntreanMedis()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
                <div id="listMedis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dynamic List -->
                </div>
            </div>

            <!-- PANEL FARMASI -->
            <div id="panelFarmasi" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xl font-bold text-slate-900">Antrean Penyiapan Obat</h3>
                    <button onclick="fetchAntreanFarmasi()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
                <div id="listFarmasi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dynamic List -->
                </div>
            </div>

        </main>
    </div>

    <script>
        let currentUser = null;

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.error('SW Error:', err));
            });
        }

        // Overlay Helper
        function showOverlay(message = 'Memproses data...') {
            document.getElementById('loadingText').innerText = message;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }

        function hideOverlay() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }

        // Generic API Caller with SweetAlert Integration
        async function callAPI(action, payload = {}, loadingMsg = 'Memproses request...') {
            if (!GAS_URL || GAS_URL.includes("URL_WEB_APP_GAS_ANDA_DI_SINI")) {
                Swal.fire({
                    icon: 'error',
                    title: 'Konfigurasi Belum Selesai',
                    text: 'URL Web App GAS belum dikonfigurasi di file index.html.'
                });
                throw new Error("Missing GAS_URL");
            }

            showOverlay(loadingMsg);

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, ...payload })
                });
                const data = await response.json();
                return data;
            } catch (err) {
                console.error("API Error:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Gagal',
                    text: 'Gagal terhubung ke server Google Apps Script. Periksa koneksi internet Anda.'
                });
                throw err;
            } finally {
                hideOverlay();
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;

            try {
                const res = await callAPI("login", { username: u, password: p }, 'Verifikasi Login...');
                if (res.status === "success") {
                    currentUser = res.user;
                    initDashboard();
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil',
                        text: `Selamat datang, ${currentUser.nama}`,
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Login',
                        text: res.message || 'Username atau Password salah'
                    });
                }
            } catch (e) {
                // error handled in callAPI
            }
        }

        // Setup UI Based on Role
        function initDashboard() {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appScreen").classList.remove("hidden");

            document.getElementById("userInfo").innerText = currentUser.nama;
            document.getElementById("userRoleBadge").innerText = currentUser.role;

            document.getElementById("panelPendaftaran").classList.add("hidden");
            document.getElementById("panelMedis").classList.add("hidden");
            document.getElementById("panelFarmasi").classList.add("hidden");

            if (currentUser.role === "PENDAFTARAN") {
                document.getElementById("panelPendaftaran").classList.remove("hidden");
            } else if (currentUser.role === "MEDIS") {
                document.getElementById("panelMedis").classList.remove("hidden");
                fetchAntreanMedis();
            } else if (currentUser.role === "FARMASI") {
                document.getElementById("panelFarmasi").classList.remove("hidden");
                fetchAntreanFarmasi();
            }
        }

        function handleLogout() {
            Swal.fire({
                title: 'Konfirmasi Keluar',
                text: 'Apakah Anda yakin ingin keluar dari sistem?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#dc2626',
                confirmButtonText: 'Ya, Keluar',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentUser = null;
                    document.getElementById("formLogin").reset();
                    document.getElementById("appScreen").classList.add("hidden");
                    document.getElementById("loginScreen").classList.remove("hidden");
                }
            });
        }

        // Submit Pendaftaran Pasien
        async function submitPendaftaran(e) {
            e.preventDefault();
            const payload = {
                nik: document.getElementById("p_nik").value,
                nama_pasien: document.getElementById("p_nama").value,
                tgl_lahir: document.getElementById("p_tgl_lahir").value,
                no_hp: document.getElementById("p_no_hp").value,
                alamat: document.getElementById("p_alamat").value,
                keluhan: document.getElementById("p_keluhan").value
            };

            const res = await callAPI("daftarPasien", payload, 'Mendaftarkan Pasien...');
            if (res && res.status === "success") {
                Swal.fire({
                    icon: 'success',
                    title: 'Pendaftaran Berhasil',
                    html: `Nomor Antrean Pasien: <b class="text-2xl text-blue-600">${res.no_antrean}</b>`
                });
                document.getElementById("formPendaftaran").reset();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Menyimpan',
                    text: res.message || 'Terjadi kesalahan sistem.'
                });
            }
        }

        // Fetch & Render Medis
        async function fetchAntreanMedis() {
            const container = document.getElementById("listMedis");
            const res = await callAPI("getAntreanMedis", {}, 'Memuat Antrean Medis...');
            
            if (!res.data || res.data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">Tidak ada pasien yang antre.</div>`;
                return;
            }

            container.innerHTML = res.data.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-2xl font-black text-blue-600">${item.no_antrean}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 font-semibold px-2 py-1 rounded">Medis</span>
                        </div>
                        <h4 class="font-bold text-slate-900">${item.nama_pasien}</h4>
                        <p class="text-xs text-slate-500 mt-1"><strong>Keluhan:</strong> ${item.keluhan}</p>
                        
                        <div class="mt-4 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Diagnosa</label>
                                <input type="text" id="diag_${item.id_antrean}" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Rincian Obat</label>
                                <textarea id="obat_${item.id_antrean}" rows="2" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Dosis / Instruksi</label>
                                <input type="text" id="dosis_${item.id_antrean}" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                    <button onclick="submitMedis('${item.id_antrean}')" class="mt-4 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg shadow transition">
                        Selesai & Kirim ke Farmasi
                    </button>
                </div>
            `).join('');
        }

        async function submitMedis(idAntrean) {
            const diag = document.getElementById(`diag_${idAntrean}`).value;
            const obat = document.getElementById(`obat_${idAntrean}`).value;
            const dosis = document.getElementById(`dosis_${idAntrean}`).value;

            if (!diag || !obat || !dosis) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Belum Lengkap',
                    text: 'Mohon isi Diagnosa, Rincian Obat, dan Dosis sebelum melanjutkan.'
                });
                return;
            }

            const payload = {
                id_antrean: idAntrean,
                diagnosa: diag,
                rincian_obat: obat,
                instruksi_dosis: dosis,
                id_tenaga_medis: currentUser.nama
            };

            const res = await callAPI("submitMedis", payload, 'Mengirim data ke Farmasi...');
            if (res && res.status === "success") {
                Swal.fire({
                    icon: 'success',
                    title: 'Pemeriksaan Selesai',
                    text: 'Resep obat berhasil diteruskan ke divisi Farmasi.',
                    timer: 1500,
                    showConfirmButton: false
                });
                fetchAntreanMedis();
            }
        }

        // Fetch & Render Farmasi
        async function fetchAntreanFarmasi() {
            const container = document.getElementById("listFarmasi");
            const res = await callAPI("getAntreanFarmasi", {}, 'Memuat Antrean Farmasi...');
            
            if (!res.data || res.data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">Tidak ada resep yang perlu disiapkan.</div>`;
                return;
            }

            container.innerHTML = res.data.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-2xl font-black text-amber-500">${item.no_antrean}</span>
                            <span class="text-xs bg-amber-50 text-amber-700 font-semibold px-2 py-1 rounded">Farmasi</span>
                        </div>
                        <h4 class="font-bold text-slate-900">${item.nama_pasien}</h4>
                        <div class="mt-3 p-3 bg-slate-50 rounded-lg text-xs space-y-1">
                            <p><strong>Resep Obat:</strong> ${item.rincian_obat}</p>
                            <p><strong>Instruksi Dosis:</strong> ${item.instruksi_dosis}</p>
                        </div>
                    </div>
                    <button onclick="submitFarmasi('${item.id_antrean}')" class="mt-4 w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg shadow transition">
                        Obat Siap & Serahkan
                    </button>
                </div>
            `).join('');
        }

        async function submitFarmasi(idAntrean) {
            Swal.fire({
                title: 'Konfirmasi Penyerahan',
                text: 'Pastikan obat sudah selesai disiapkan untuk diserahkan ke pasien.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Penyerahan Selesai',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await callAPI("submitFarmasi", { id_antrean: idAntrean }, 'Menyelesaikan Antrean...');
                    if (res && res.status === "success") {
                        Swal.fire({
                            icon: 'success',
                            title: 'Selesai',
                            text: 'Antrean pasien telah diselesaikan.',
                            timer: 1500,
                            showConfirmButton: false
                        });
                        fetchAntreanFarmasi();
                    }
                }
            });
        }
    </script>
</body>
</html>
